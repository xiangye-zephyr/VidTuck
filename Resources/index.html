<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>VidTuck</title><link rel="stylesheet" href="app.css"></head><body>
<main id="dropzone"><div id="jobs"></div><div id="empty"><img src="AppIcon.png" alt=""><p>拖入视频链接，或按 ⌘V 粘贴</p></div><div id="dropHint">松开以添加视频链接</div></main>
<footer><div class="tools"><button id="paste" title="从剪贴板添加 ⌘V" aria-label="从剪贴板添加"></button><button data-sheet="browser" title="网页辅助" aria-label="网页辅助"></button></div><span id="summary" role="status">暂无下载</span><div class="tools"><button data-action="openFolder" title="打开保存目录" aria-label="打开保存目录"></button><button data-action="clearDone" id="clearDone" title="清除已完成记录，保留文件" aria-label="清除已完成记录"></button><button id="history" title="只看已完成" aria-label="只看已完成" aria-pressed="false"></button><button data-sheet="settings" title="设置 ⌘," aria-label="设置"></button></div></footer>
<dialog id="addSheet" aria-labelledby="addTitle"><form method="dialog" class="sheet-head"><b id="addTitle">添加视频链接</b><button class="dismiss" aria-label="关闭">×</button></form><textarea id="url" placeholder="粘贴视频链接或分享文案，可一次添加多个…" aria-label="视频链接" spellcheck="false"></textarea><div class="actions"><button data-close>取消</button><button class="primary" id="add">添加</button></div></dialog>
<dialog id="settings" aria-labelledby="settingsTitle"><form method="dialog" class="sheet-head"><b id="settingsTitle">设置</b><button class="dismiss" aria-label="关闭">×</button></form><div class="sheet-scroll"><div class="row"><label for="quality">默认清晰度</label><select id="quality"><option value="best">最高可用</option><option value="2160">最高 4K</option><option value="1080">最高 1080p</option><option value="720">最高 720p</option><option value="480">最高 480p</option></select></div><div class="row"><label for="mode">保存为</label><select id="mode"><option value="video">视频 + 音频</option><option value="audio">仅音频 · M4A</option></select></div><div class="row"><label for="autoDownload">添加链接后自动下载</label><input id="autoDownload" type="checkbox" checked></div><div class="row"><span>保存位置</span><button data-action="folder">选择文件夹…</button></div><p class="muted path" id="folder"></p><div class="row"><span>解析器 <small id="version"></small></span><button data-action="update" id="updateBtn">更新</button></div><details><summary>本地登录信息</summary><p class="muted">可在网页辅助登录，或导入对应平台的 cookies.txt。</p><div id="cookieRows"></div><div class="actions"><button data-action="clearLogin">清除本应用登录状态</button></div></details><p class="muted fine">VidTuck 0.2.6 · 下载文件保存在本机。最高画质取决于视频源与账号权限。</p></div></dialog>
<dialog id="browser" aria-labelledby="browserTitle"><form method="dialog" class="sheet-head"><b id="browserTitle">网页辅助</b><button class="dismiss" aria-label="关闭">×</button></form><div class="sheet-scroll"><p class="muted">通常直接粘贴链接即可。遇到登录或网站验证时，在这里打开目标视频，播放后点“读取此页”。</p><div id="browserPlatforms"></div><p class="muted fine">小红书请优先粘贴完整视频分享链接，保留链接参数。</p></div></dialog>
<dialog id="taskOptions" aria-labelledby="taskOptionsTitle"><form method="dialog" class="sheet-head"><b id="taskOptionsTitle">任务选项</b><button class="dismiss" aria-label="关闭">×</button></form><div class="row"><label for="taskQuality">清晰度</label><select id="taskQuality"><option value="best">最高可用</option><option value="2160">最高 4K</option><option value="1080">最高 1080p</option><option value="720">最高 720p</option><option value="480">最高 480p</option></select></div><div class="row"><label for="taskMode">保存为</label><select id="taskMode"><option value="video">视频</option><option value="audio">音频 · M4A</option></select></div><div class="actions"><button class="primary" id="saveTaskOptions">保存</button></div></dialog>
<div id="toast" role="status"></div><script src="app.js"></script></body></html>
